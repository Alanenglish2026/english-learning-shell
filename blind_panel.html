<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; media-src blob:; connect-src 'none'"><style>body{font:18px system-ui;margin:16px}button,select{font:inherit;padding:14px;margin:12px 0;display:block}audio{width:100%}</style></head><body><audio id="sound" controls></audio><label><input id="blind" type="checkbox">我没有看过学习者的选择</label><select id="action"><option value="repeat">请再说一次</option><option value="water">递水</option><option value="tea">递茶</option><option value="no_action">没听懂，不猜</option></select><button id="send">回应</button><p id="status"></p><script>
let ticket,url,listened=false,locked=false;const sound=document.getElementById('sound');sound.onended=()=>listened=true;
window.addEventListener('message',e=>{if(e.source!==parent)return;if(e.data?.type==='audio'&&!ticket){ticket=e.data.ticket;url=URL.createObjectURL(e.data.blob);sound.src=url;}if(e.data?.type==='cleanup'){sound.pause();sound.removeAttribute('src');sound.load();if(url)URL.revokeObjectURL(url);url=null;ticket=null;}});
document.getElementById('send').onclick=()=>{if(!listened||locked){document.getElementById('status').textContent='请先完整听一次。';return;}locked=true;const a=document.getElementById('action').value;parent.postMessage({type:'result',ticket,result:{listener_heard:'',listener_confidence:'human_action',listener_action:a,requested_repeat:a==='repeat',blind_attested:document.getElementById('blind').checked,audio_listened:true}},'*');};parent.postMessage({type:'ready'},'*');
</script></body></html>
