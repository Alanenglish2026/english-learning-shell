<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>协助听</title><style>body{font-family:system-ui;margin:0;padding:24px;background:#fff;color:#111;color-scheme:light dark}@media(prefers-color-scheme:dark){body{background:#101820;color:#eef4fa}button{background:#24313d;color:#eef4fa;border:1px solid #536273}}button{display:block;width:100%;min-height:52px;margin:12px 0;font-size:18px}.hidden{display:none}</style></head><body><main id="app"><h1>请听学习者刚才说的话</h1><p>不要看学习者的答案。听完整后，选择你实际会采取的行动。</p><button id="listen">听完整一次</button><div id="actions" class="hidden"></div><label><input id="blind" type="checkbox"> 我没有看到或被告知学习者这次的答案</label><label><input id="other" type="checkbox"> 我不是这位学习者本人</label><p id="done" class="hidden">已回应，请把设备交还学习者。</p></main><script>
let port=null,task=null,listened=false,currentAudio=null,interrupted=false;const $=x=>document.getElementById(x);
function ready(){try{parent.postMessage({type:'listener_ready'},'*')}catch{}}
ready();
window.addEventListener('message',e=>{const d=e.data||{};if(e.source!==parent)return;if(d.type==='request_ready'){ready();return;}if(d.type!=='listener_task'||!e.ports?.[0]||task)return;task=d;port=e.ports[0];port.start?.();$('listen').onclick=listenOnce;});
async function listenOnce(){listened=false;interrupted=false;if(currentAudio){try{currentAudio.pause()}catch{}}const a=currentAudio=new Audio(task.audio_url);a.preload='auto';a.playbackRate=1;a.defaultPlaybackRate=1;let sought=false,rateChanged=false;const abort=()=>{if(!a.ended)interrupted=true};a.addEventListener('seeking',()=>{sought=true});a.addEventListener('ratechange',()=>{if(Math.abs(a.playbackRate-1)>.001)rateChanged=true});a.addEventListener('pause',abort);const onVis=()=>{if(document.hidden)abort()};document.addEventListener('visibilitychange',onVis);try{await a.play();await new Promise((resolve,reject)=>{a.onended=resolve;a.onerror=reject});const dur=Number(a.duration),end=Number(a.currentTime),ranges=a.played;let covers=false;if(Number.isFinite(dur)&&dur>0&&ranges?.length){const first=ranges.start(0),last=ranges.end(ranges.length-1);covers=first<=.15&&last>=dur-.15;}listened=!interrupted&&!sought&&!rateChanged&&a.ended&&Number.isFinite(dur)&&end>=dur-.15&&covers;if(listened)renderActions();else throw Error('incomplete_playback');}catch{$('actions').className='hidden';}finally{document.removeEventListener('visibilitychange',onVis);currentAudio=null;}}
function renderActions(){$('actions').replaceChildren();$('actions').className='';for(const action of task.allowed_actions){const b=document.createElement('button');b.textContent=action==='repeat'?'请再说一次':action==='no_action'?'没听清，不行动':action;b.onclick=()=>submit(action);$('actions').append(b);}}
function submit(action){if(!listened||!$('blind').checked||!$('other').checked)return;port.postMessage({type:'listener_result',receipt:task.receipt,action,audio_listened:true,blind_attested:true,non_learner_attested:true});$('actions').className='hidden';$('listen').className='hidden';$('done').className='';}
</script></body></html>
